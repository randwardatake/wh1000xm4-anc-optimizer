[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xm4_optimizer"
version = "0.1.0"
description = "Unofficial Sony WH-1000XM4 Bluetooth tools: NVDM backup and parser, official firmware flasher, ANC control, EQ presets and an experimental spatial audio prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Ege", email = "randward@proton.me"}
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
xm4-optimizer = "xm4_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xm4_optimizer*"]

[tool.setuptools.package-data]
"xm4_optimizer.transport" = ["macos/*.swift", "macos/Info.plist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
